<script>
'use strict';

// ───── 12 SIGNS ─────
const S = (n,en,gly,p,el,mo,ru,kw,gen,pos,neg,lo,wo,co,ca) =>
    ({type:'sign',n,en,gly,p,el,mo,ru,kw,gen,pos,neg,lo,wo,co,ca});
const SIGNS = [
    S('牡羊座','Aries','♈','3/21–4/19','fire','活動宮','火星',
      ['開拓','直球','行動','自我','勇気'],
      '12星座の最初。新しいことを切り開くパイオニア精神。直情的で行動が早い。負けず嫌いで一番が好き。',
      '行動力・リーダーシップ・純粋・情熱的・即決即断',
      '短気・自己中心・我慢ができない・飽きっぽい',
      '一目惚れタイプ。アプローチも直球。狩人気質で追いかけ甲斐のある相手に燃える。',
      '起業家・営業・スポーツ・新規開拓。トップで動く方が活きる。指示される仕事は不向き。',
      ['獅子座','射手座','双子座','水瓶座'],
      '焦らない。途中で投げ出さない。'),
    S('牡牛座','Taurus','♉','4/20–5/20','earth','不動宮','金星',
      ['安定','五感','所有','マイペース','美'],
      '五感を重視する現実主義者。ゆったり堅実。一度決めると動かない頑固さも。グルメで美意識高い。',
      '忍耐・安定感・美的センス・信頼性・包容力',
      '頑固・物欲・変化嫌い・怠惰になりがち',
      'ゆっくり進む。スキンシップ重視。長続きするタイプ。お金や安定も愛の一部と捉える。',
      '金融・美容・飲食・建築・農業。コツコツ系で長く続く仕事。',
      ['乙女座','山羊座','蟹座','魚座'],
      '変化に対応する柔軟さも必要。'),
    S('双子座','Gemini','♊','5/21–6/21','air','柔軟宮','水星',
      ['知性','好奇心','多面性','言葉','軽やか'],
      '好奇心旺盛で多才。コミュ力高く器用だが、飽きっぽい。情報通でフットワークが軽い。',
      '機転・適応力・話術・多才・若々しさ',
      '飽きっぽい・浅い・二面性・落ち着きなし',
      '会話を楽しむ恋。退屈は天敵。フィーリングで動く軽やかな関係を好む。',
      'メディア・営業・通訳・IT・ライター。情報を扱う仕事。',
      ['天秤座','水瓶座','牡羊座','獅子座'],
      '一点集中の修行も時に必要。'),
    S('蟹座','Cancer','♋','6/22–7/22','water','活動宮','月',
      ['家庭','母性','感受性','守る','記憶'],
      '仲間や家族を守る母性的な人。情に厚い。感受性が強く傷つきやすい。記憶力良好。',
      '思いやり・守りの強さ・共感力・記憶力・家庭的',
      '過保護・感情的・内弁慶・ため込む',
      '一途で深い愛。所有欲も強め。家庭志向で結婚向き。',
      '看護・教育・飲食・不動産・カウンセラー。ケア系。',

      '内輪意識を超えて広く目を向けて。'),
    S('獅子座','Leo','♌','7/23–8/22','fire','不動宮','太陽',

      'カリスマ・創造性・寛大・楽天的・リーダーシップ',

    S('乙女座','Virgo','♍','8/23–9/22','earth','柔軟宮','水星',

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const tabs = document.getElementById('tabs');
const bdBar = document.getElementById('bd-bar');
const elemTable = document.getElementById('elemtable');
let curTab = 'signs';
let curQuery = '';

function matches(item) {
    if (!curQuery) return true;
    const q = curQuery.toLowerCase();
    const fields = [
        item.n, item.nm, item.en, ...(item.kw || []),
        ...(item.topics || []),
    ].filter(Boolean).map(s => String(s));
    return fields.some(s => s.toLowerCase().includes(q) || s.includes(curQuery));
}

function renderGrid() {
    grid.innerHTML = '';
    grid.className = 'grid ' + curTab;
    let list;
    if (curTab === 'signs') list = SIGNS;
    else if (curTab === 'planets') list = PLANETS;
    else if (curTab === 'houses') list = HOUSES;
    else list = ASPECTS;
    list = list.filter(matches);

    if (list.length === 0) {
        grid.innerHTML = '<div class="empty-msg">該当する項目が見つかりません</div>';
        return;
    }

    list.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        if (item.type === 'sign') el.dataset.el = item.el;
        else if (item.type === 'planet') el.dataset.pl = item.t;
        else if (item.type === 'house') el.dataset.ho = item.ty;
        else if (item.type === 'aspect') el.dataset.as = item.t;

        if (item.type === 'sign') {
            el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n}</div><div class="sub">${item.p}</div>`;
        } else if (item.type === 'planet') {
            el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n}</div><div class="sub">${item.en}</div>`;
        } else if (item.type === 'house') {
            el.innerHTML = `<div class="num">${item.no}H</div><div class="nm" style="font-size:14px;margin-top:14px">${item.nm}</div><div class="sub">${item.ty === 'angular' ? 'アングル' : item.ty === 'succedent' ? 'サクシーデント' : 'ケーデント'}</div>`;
        } else if (item.type === 'aspect') {
            el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n.replace(/\(.*\)/, '')}</div><div class="sub">${item.ang}</div>`;
        }
        el.addEventListener('click', () => openModal(item));
        grid.appendChild(el);
    });
}

            <span class="chip ${item.t === 'tense' ? '' : 'gold'}">${({harmonic:'☀ 調和(ソフト)',tense:'⚡ 緊張(ハード)',neutral:'⚙ 中性'}[item.t])}</span>
        </div>
        <div class="kw-row">${item.kw.map(k => `<span class="kw">${k}</span>`).join('')}</div>
        <div class="section">
            <div class="section-title">▼ 解釈</div>
            <div class="section-body">${item.gen}</div>
        </div>
        <div class="advice">
            <div class="advice-label">✦ アドバイス</div>
            <div class="advice-text">${item.ad}</div>
        </div>`;
    }
    detailContent.innerHTML = html;

    // bind compatibility jumps
    detailContent.querySelectorAll('.compat[data-jump]').forEach(c => {
        c.addEventListener('click', () => {
            const jumpName = c.dataset.jump;
            const target = SIGNS.find(s => s.n === jumpName);
            if (target) {
                document.getElementById('modal-inner').scrollTop = 0;
                openModal(target);
            }
        });
    });

    modal.classList.add('show');
    document.getElementById('modal-inner').scrollTop = 0;
}

document.getElementById('close').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

// ───── search & tabs ─────
search.addEventListener('input', () => {
    curQuery = search.value.trim();
    if (curQuery) {
        // when searching, search all categories
        const matched = ALL.filter(matches);
        grid.className = 'grid signs';
        grid.innerHTML = '';
        if (matched.length === 0) {
            grid.innerHTML = '<div class="empty-msg">該当する項目が見つかりません</div>';
        } else {
            // group by type
            const groups = { sign: '⭐ 星座', planet: '🪐 惑星', house: '🏛 ハウス', aspect: '∠ アスペクト' };
            const byType = {};
            matched.forEach(m => {
                if (!byType[m.type]) byType[m.type] = [];
                byType[m.type].push(m);
            });
            Object.entries(byType).forEach(([t, items]) => {
                const h = document.createElement('div');
                h.style.cssText = 'grid-column: 1/-1; color: #fbbf24; font-size: 12px; letter-spacing: 2px; padding: 8px 0 4px; font-family: system-ui';
                h.textContent = groups[t];
                grid.appendChild(h);
                items.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'item';
                    if (item.type === 'sign') el.dataset.el = item.el;
                    else if (item.type === 'planet') el.dataset.pl = item.t;
                    else if (item.type === 'house') el.dataset.ho = item.ty;
                    else if (item.type === 'aspect') el.dataset.as = item.t;

                    if (item.type === 'sign') {
                        el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n}</div><div class="sub">${item.p}</div>`;
                    } else if (item.type === 'planet') {
                        el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n}</div><div class="sub">${item.en}</div>`;
                    } else if (item.type === 'house') {
                        el.innerHTML = `<div class="num">${item.no}H</div><div class="nm" style="font-size:14px;margin-top:14px">${item.nm}</div><div class="sub">${item.ty === 'angular' ? 'アングル' : item.ty === 'succedent' ? 'サクシーデント' : 'ケーデント'}</div>`;
                    } else if (item.type === 'aspect') {
                        el.innerHTML = `<div class="gly">${item.gly}</div><div class="nm">${item.n.replace(/\(.*\)/, '')}</div><div class="sub">${item.ang}</div>`;
                    }
                    el.addEventListener('click', () => openModal(item));
                    grid.appendChild(el);
                });
            });
        }
        bdBar.style.display = 'none';
        elemTable.style.display = 'none';
    } else {
        renderGrid();
        updateExtras();
    }
});

tabs.addEventListener('click', (e) => {
    const t = e.target.closest('.tab');
    if (!t) return;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    curTab = t.dataset.tab;
    renderGrid();
    updateExtras();
});

function updateExtras() {
    if (curTab === 'signs') {
        bdBar.style.display = 'flex';
        elemTable.style.display = 'block';
    } else {
        bdBar.style.display = 'none';
        elemTable.style.display = 'none';
    }
}

// ───── birthday → sun sign ─────
function getSunSign(month, day) {
    // boundaries
    const b = [
        [1, 19, '山羊座'],
        [2, 18, '水瓶座'],
        [3, 20, '魚座'],
        [4, 19, '牡羊座'],
        [5, 20, '牡牛座'],
        [6, 21, '双子座'],
        [7, 22, '蟹座'],
        [8, 22, '獅子座'],
        [9, 22, '乙女座'],
        [10, 23, '天秤座'],
        [11, 22, '天秤座'], // wait, this is wrong
    ];
    // Use simpler boundary array
    const bounds = [
        {until:[1,19], sign:'山羊座'},
        {until:[2,18], sign:'水瓶座'},
        {until:[3,20], sign:'魚座'},
        {until:[4,19], sign:'牡羊座'},
        {until:[5,20], sign:'牡牛座'},
        {until:[6,21], sign:'双子座'},
        {until:[7,22], sign:'蟹座'},
        {until:[8,22], sign:'獅子座'},
        {until:[9,22], sign:'乙女座'},
        {until:[10,23], sign:'天秤座'},
        {until:[11,22], sign:'蠍座'},
        {until:[12,21], sign:'射手座'},
        {until:[12,31], sign:'山羊座'},
    ];
    for (const b of bounds) {
        if (month < b.until[0] || (month === b.until[0] && day <= b.until[1])) {
            return b.sign;
        }
    }
    return '山羊座';
}

document.getElementById('bd').addEventListener('change', (e) => {
    const v = e.target.value;
    if (!v) return;
    const [y, m, d] = v.split('-').map(Number);
    const s = getSunSign(m, d);
    document.getElementById('bd-result').textContent = '→ ' + s + ' (太陽)';
    document.getElementById('bd-result').style.cursor = 'pointer';
    document.getElementById('bd-result').onclick = () => {
        const sign = SIGNS.find(x => x.n === s);
        if (sign) openModal(sign);
    };
});

// ───── element table ─────
function buildElemTable() {
    const elems = [
        { lbl: '🔥 火', signs: SIGNS.filter(s => s.el === 'fire') },
        { lbl: '🌳 地', signs: SIGNS.filter(s => s.el === 'earth') },
        { lbl: '💨 風', signs: SIGNS.filter(s => s.el === 'air') },
        { lbl: '💧 水', signs: SIGNS.filter(s => s.el === 'water') },
        { lbl: '⚡ 活動宮', signs: SIGNS.filter(s => s.mo === '活動宮') },
        { lbl: '🗿 不動宮', signs: SIGNS.filter(s => s.mo === '不動宮') },
        { lbl: '🍃 柔軟宮', signs: SIGNS.filter(s => s.mo === '柔軟宮') },
    ];
    document.getElementById('elem-rows').innerHTML = elems.map(e => `
        <div class="elem-row">
            <div class="elem-label">${e.lbl}</div>
            <div class="elem-signs">${e.signs.map(s => `<span class="elem-chip" data-sign="${s.n}">${s.gly} ${s.n}</span>`).join('')}</div>
        </div>`).join('');
    document.querySelectorAll('.elem-chip').forEach(c => c.addEventListener('click', () => {
        const sign = SIGNS.find(s => s.n === c.dataset.sign);
        if (sign) openModal(sign);
    }));
}

// init
buildElemTable();
renderGrid();
updateExtras();
</script>
</body>
