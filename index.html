    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));

    document.title = dict.title + ' | Pinda Lab';

function matches(item) {
    if (!curQuery) return true;
    const q = curQuery.toLowerCase();
    const fields = [];
    if (item.n) fields.push(L(item.n));
    if (item.nm) fields.push(L(item.nm));
    if (item.en) fields.push(item.en);
    const kw = L(item.kw);
    if (Array.isArray(kw)) fields.push(...kw);
    const topics = L(item.topics);
    if (Array.isArray(topics)) fields.push(...topics);
    return fields.some(s => s && (String(s).toLowerCase().includes(q) || String(s).includes(curQuery)));
}

function jdUTC(y, m, d, hour, minute) {
    let yy = y, mm = m;
    if (mm <= 2) { yy -= 1; mm += 12; }
    const A = Math.floor(yy / 100);
    const B = 2 - A + Math.floor(A / 4);
    const jd = Math.floor(365.25 * (yy + 4716)) + Math.floor(30.6001 * (mm + 1)) + d + B - 1524.5;
    return jd + (hour + minute / 60) / 24;
}

function localToJD(y, m, d, hour, minute, tz) {
    let utcMs = Date.UTC(y, m - 1, d, hour, minute);
    for (let i = 0; i < 3; i++) {
        const fmt = new Intl.DateTimeFormat('en-US', {
            timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit',
            hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false
        });
        const parts = fmt.formatToParts(new Date(utcMs));
        const o = {};
        parts.forEach(p => { if (p.type !== 'literal') o[p.type] = p.value; });
        let hh = +o.hour; if (hh === 24) hh = 0;
        const projected = Date.UTC(+o.year, +o.month - 1, +o.day, hh, +o.minute, +(o.second || 0));
        const target = Date.UTC(y, m - 1, d, hour, minute);
        utcMs += target - projected;
    }
    const dt = new Date(utcMs);
    return jdUTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate(),
                 dt.getUTCHours(), dt.getUTCMinutes() + dt.getUTCSeconds() / 60);
}

function solveKepler(M, e) {
    let E = M + e * Math.sin(M);
    for (let i = 0; i < 30; i++) {
        const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
        E -= dE;
        if (Math.abs(dE) < 1e-12) break;
    }
    return E;
}

function helio(planet, T) {
    const [base, rate] = PE[planet];
    const a = base[0] + rate[0] * T;
    const e = base[1] + rate[1] * T;
    const I = (base[2] + rate[2] * T) * DEG;
    const L = base[3] + rate[3] * T;
    const wbar = base[4] + rate[4] * T;
    const Om = (base[5] + rate[5] * T) * DEG;
    let M = mod360(L - wbar);
    if (M > 180) M -= 360;
    M *= DEG;
    const E = solveKepler(M, e);
    const xp = a * (Math.cos(E) - e);
    const yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
    const omega = wbar * DEG - Om;
    const cO = Math.cos(Om), sO = Math.sin(Om);
    const cI = Math.cos(I), sI = Math.sin(I);
    const cw = Math.cos(omega), sw = Math.sin(omega);
    const x = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
    const y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
    const z = sw * sI * xp + cw * sI * yp;
    return [x, y, z];
}

function geoLong(planet, T) {
    if (planet === 'Sun') {
        const [ex, ey] = helio('Earth', T);
        return mod360(Math.atan2(-ey, -ex) / DEG);
    }
    const [px, py] = helio(planet, T);
    const [ex, ey] = helio('Earth', T);
    return mod360(Math.atan2(py - ey, px - ex) / DEG);
}

function precessionLon(T) {
    return (5028.796195 * T + 1.1054348 * T * T) / 3600;
}

function tropical(j2kLong, T) {
    return mod360(j2kLong + precessionLon(T));
}

function moonLong(jd) {
    const T = (jd - 2451545) / 36525;
    const Lm = 218.3164477 + 481267.88123421 * T - 0.0015786 * T * T;
    const D = (297.8501921 + 445267.1114034 * T - 0.0018819 * T * T) * DEG;
    const M = (357.5291092 + 35999.0502909 * T - 0.0001536 * T * T) * DEG;
    const Mp = (134.9633964 + 477198.8675055 * T + 0.0087414 * T * T) * DEG;
    const F = (93.2720950 + 483202.0175233 * T - 0.0036539 * T * T) * DEG;
    let dL = 0;
    dL += 6.288774 * Math.sin(Mp);
    dL += 1.274027 * Math.sin(2*D - Mp);
    dL += 0.658314 * Math.sin(2*D);
    dL += 0.213618 * Math.sin(2*Mp);
    dL -= 0.185116 * Math.sin(M);
    dL -= 0.114332 * Math.sin(2*F);
    dL += 0.058793 * Math.sin(2*D - 2*Mp);
    dL += 0.057066 * Math.sin(2*D - M - Mp);
    dL += 0.053322 * Math.sin(2*D + Mp);
    dL += 0.045758 * Math.sin(2*D - M);
    dL -= 0.040923 * Math.sin(M - Mp);
    dL -= 0.034720 * Math.sin(D);
    dL -= 0.030383 * Math.sin(M + Mp);
    dL += 0.015327 * Math.sin(2*D - 2*F);
    dL -= 0.012528 * Math.sin(Mp + 2*F);
    dL += 0.010980 * Math.sin(Mp - 2*F);
    dL += 0.010675 * Math.sin(4*D - Mp);
    dL += 0.010034 * Math.sin(3*Mp);
    dL += 0.008548 * Math.sin(4*D - 2*Mp);
    return mod360(Lm + dL);
}

function isRetrograde(planet, jd) {
    if (planet === 'Sun' || planet === 'Moon') return false;
    const T1 = (jd - 0.5 - 2451545) / 36525;
    const T2 = (jd + 0.5 - 2451545) / 36525;
    const l1 = tropical(geoLong(planet, T1), T1);
    const l2 = tropical(geoLong(planet, T2), T2);
    let d = l2 - l1;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d < 0;
}

function gmst(jd) {
    const T = (jd - 2451545.0) / 36525;
    const theta = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000.0;
    return mod360(theta);
}

function obliquity(jd) {
    const T = (jd - 2451545.0) / 36525;
    return 23.43929111 - 0.0130041667 * T - 1.638889e-7 * T * T + 5.0361e-7 * T * T * T;
}

function ascMC(jd, lat, lon) {
    const lstDeg = mod360(gmst(jd) + lon);
    const ramc = lstDeg * DEG;
    const eps = obliquity(jd) * DEG;
    const phi = lat * DEG;
    const mcRad = Math.atan2(Math.sin(ramc), Math.cos(ramc) * Math.cos(eps));
    const mc = mod360(mcRad / DEG);
    const ascRad = Math.atan2(Math.cos(ramc), -(Math.sin(eps) * Math.tan(phi) + Math.cos(eps) * Math.sin(ramc)));
    const asc = mod360(ascRad / DEG);
    return { asc, mc, lst: lstDeg };
}

function signOfLong(lon) { return Math.floor(mod360(lon) / 30); }
function degInSign(lon) { return mod360(lon) % 30; }
function formatDeg(lon) {
    const d = degInSign(lon);
    const deg = Math.floor(d);
    const min = Math.floor((d - deg) * 60);
    return `${deg}°${String(min).padStart(2,'0')}'`;
}
function houseOfLong(lon, ascSignIdx) {
    const ps = signOfLong(lon);
    let h = ps - ascSignIdx + 1;
    if (h <= 0) h += 12;
    return h;
}

const ASPECT_DEFS = [
    { ang: 0,   orb: 8, type: 'neutral',  gly: '☌', idx: 0 },
    { ang: 60,  orb: 5, type: 'harmonic', gly: '⚹', idx: 1 },
    { ang: 90,  orb: 7, type: 'tense',    gly: '□', idx: 2 },
    { ang: 120, orb: 7, type: 'harmonic', gly: '△', idx: 3 },
    { ang: 180, orb: 8, type: 'tense',    gly: '☍', idx: 4 },
];

function detectAspect(lonA, lonB) {
    let d = Math.abs(mod360(lonA) - mod360(lonB));
    if (d > 180) d = 360 - d;
    let best = null;
    for (const a of ASPECT_DEFS) {
        const orb = Math.abs(d - a.ang);
        if (orb <= a.orb && (!best || orb < best.orb)) best = { ...a, orb };
    }
    return best;
}

const PLANET_GLYPHS = { Sun:'☉', Moon:'☽', Mercury:'☿', Venus:'♀', Mars:'♂',
                        Jupiter:'♃', Saturn:'♄', Uranus:'♅', Neptune:'♆', Pluto:'♇' };
const PLANET_ORDER = ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'];

function computeChart(y, m, d, hour, minute, lat, lon, tz) {
    const jd = localToJD(y, m, d, hour, minute, tz);
    const T = (jd - 2451545) / 36525;
    const placements = {};
    placements.Sun  = tropical(geoLong('Sun', T), T);
    placements.Moon = moonLong(jd);
    for (const p of ['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']) {
        placements[p] = tropical(geoLong(p, T), T);
    }
    const retro = {};
    for (const p of PLANET_ORDER) retro[p] = isRetrograde(p, jd);
    const am = ascMC(jd, lat, lon);
    placements.ASC = am.asc;
    placements.MC = am.mc;
    const ascSignIdx = signOfLong(am.asc);
    const houses = {};
    for (const p of PLANET_ORDER) houses[p] = houseOfLong(placements[p], ascSignIdx);
    houses.ASC = 1;
    houses.MC = houseOfLong(am.mc, ascSignIdx);
    const aspects = [];
    for (let i = 0; i < PLANET_ORDER.length; i++) {
        for (let j = i + 1; j < PLANET_ORDER.length; j++) {
            const a = detectAspect(placements[PLANET_ORDER[i]], placements[PLANET_ORDER[j]]);
            if (a) aspects.push({ p1: PLANET_ORDER[i], p2: PLANET_ORDER[j], ...a });
        }
    }
    return { jd, placements, retro, houses, ascSignIdx };
}

// ───── SVG chart wheel ─────
function svgChartWheel(chart) {
    const { placements, retro, ascSignIdx } = chart;
    const W = 480, H = 480, cx = W/2, cy = H/2;
    const R_OUT = 230, R_SIGN_IN = 198, R_HOUSE_IN = 168, R_INNER = 150, R_ASPECT = 120;
    const asc = placements.ASC;
    const angleRad = lon => (180 + (lon - asc)) * DEG;
    const xy = (lon, r) => {
        const t = angleRad(lon);
        return [cx + r * Math.cos(t), cy - r * Math.sin(t)];
    };
    const arc = (r1, r2, lonStart, lonEnd, fill, stroke) => {
        const [x1a, y1a] = xy(lonStart, r2);
        const [x1b, y1b] = xy(lonEnd, r2);
        const [x2a, y2a] = xy(lonEnd, r1);
        const [x2b, y2b] = xy(lonStart, r1);
        const a = Math.abs(lonEnd - lonStart);
        const large = a > 180 ? 1 : 0;
        return `<path d="M ${x1a} ${y1a} A ${r2} ${r2} 0 ${large} 0 ${x1b} ${y1b} L ${x2a} ${y2a} A ${r1} ${r1} 0 ${large} 1 ${x2b} ${y2b} Z" fill="${fill}" stroke="${stroke}" stroke-width="0.5"/>`;
    };
    const elemColor = ['fire','earth','air','water','fire','earth','air','water','fire','earth','air','water'];
    const elemFill = { fire:'rgba(127,29,29,0.35)', earth:'rgba(20,83,45,0.35)', air:'rgba(113,63,18,0.35)', water:'rgba(30,58,138,0.35)' };
    let s = `<svg class="chart-wheel" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
    s += `<defs><filter id="glow"><feGaussianBlur stdDeviation="2"/></filter></defs>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R_OUT}" fill="rgba(10,10,42,0.5)" stroke="rgba(251,191,36,0.5)" stroke-width="1.2"/>`;
    for (let i = 0; i < 12; i++) {
        const lonStart = i * 30, lonEnd = (i + 1) * 30;
        s += arc(R_SIGN_IN, R_OUT, lonStart, lonEnd, elemFill[elemColor[i]], 'rgba(167,139,250,0.4)');
        const [gx, gy] = xy(lonStart + 15, (R_OUT + R_SIGN_IN) / 2);
        s += `<text x="${gx}" y="${gy + 7}" text-anchor="middle" fill="#fde047" font-size="20" font-family="serif">${SIGN_GLYPHS[i]}</text>`;
        const [lx, ly] = xy(lonStart, R_OUT);
        const [lx2, ly2] = xy(lonStart, R_SIGN_IN);
        s += `<line x1="${lx}" y1="${ly}" x2="${lx2}" y2="${ly2}" stroke="rgba(167,139,250,0.5)" stroke-width="0.6"/>`;
    }
    s += `<circle cx="${cx}" cy="${cy}" r="${R_SIGN_IN}" fill="none" stroke="rgba(167,139,250,0.5)" stroke-width="0.8"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${R_HOUSE_IN}" fill="none" stroke="rgba(167,139,250,0.4)" stroke-width="0.8"/>`;
    for (let h = 0; h < 12; h++) {
        const houseStartLon = (ascSignIdx + h) * 30;
        const [hx, hy] = xy(houseStartLon, R_SIGN_IN);
        const [hx2, hy2] = xy(houseStartLon, R_HOUSE_IN);
        s += `<line x1="${hx}" y1="${hy}" x2="${hx2}" y2="${hy2}" stroke="rgba(251,191,36,0.5)" stroke-width="0.8"/>`;
        const [tx, ty] = xy(houseStartLon + 15, (R_SIGN_IN + R_HOUSE_IN) / 2);
        s += `<text x="${tx}" y="${ty + 4}" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="system-ui">${h + 1}</text>`;
    }
    const angles = [
        { lon: placements.ASC, label: 'ASC', color: '#fbbf24' },
        { lon: placements.MC,  label: 'MC',  color: '#fbbf24' },
        { lon: mod360(placements.ASC + 180), label: 'DC', color: 'rgba(251,191,36,0.5)' },
        { lon: mod360(placements.MC + 180),  label: 'IC', color: 'rgba(251,191,36,0.5)' }
    ];
    angles.forEach(a => {
        const [x1, y1] = xy(a.lon, R_HOUSE_IN);
        const [x2, y2] = xy(a.lon, 0);
        s += `<line x1="${x1}" y1="${y1}" x2="${cx}" y2="${cy}" stroke="${a.color}" stroke-width="1" stroke-dasharray="${a.label === 'ASC' || a.label === 'MC' ? '0' : '3,3'}"/>`;
        const [lx, ly] = xy(a.lon, R_OUT + 10);
        s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" fill="${a.color}" font-size="10" font-family="system-ui" font-weight="700">${a.label}</text>`;
    });
    const planetItems = PLANET_ORDER.map(p => ({ name: p, lon: placements[p], retro: retro[p] }));
    planetItems.sort((a, b) => mod360(a.lon - asc) - mod360(b.lon - asc));
    const placed = [];
    for (const pl of planetItems) {
        let r = R_INNER;
        for (const q of placed) {
            let d = Math.abs(pl.lon - q.lon);
            if (d > 180) d = 360 - d;
            if (d < 8 && Math.abs(q.r - r) < 16) r = q.r - 18;
        }
        if (r < R_ASPECT + 8) r = R_INNER;
        placed.push({ ...pl, r });
    }
    for (let i = 0; i < placed.length; i++) {
        for (let j = i + 1; j < placed.length; j++) {
            const a = detectAspect(placed[i].lon, placed[j].lon);
            if (!a) continue;
            const [x1, y1] = xy(placed[i].lon, R_ASPECT);
            const [x2, y2] = xy(placed[j].lon, R_ASPECT);
            const col = a.type === 'harmonic' ? 'rgba(110,231,183,0.45)' : a.type === 'tense' ? 'rgba(248,113,113,0.45)' : 'rgba(253,224,71,0.45)';
            const dash = a.type === 'tense' ? '4,3' : '0';
            s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1" stroke-dasharray="${dash}"/>`;
        }
    }
    for (const pl of placed) {
        const [px, py] = xy(pl.lon, pl.r);
        const [tx, ty] = xy(pl.lon, pl.r - 16);
        s += `<text x="${px}" y="${py + 7}" text-anchor="middle" fill="#fde047" font-size="20" font-family="serif">${PLANET_GLYPHS[pl.name]}</text>`;
        s += `<text x="${tx}" y="${ty + 3}" text-anchor="middle" fill="#fbbf24" font-size="9" font-family="system-ui">${Math.floor(degInSign(pl.lon))}°${pl.retro ? '<tspan fill=\"#f87171\"> ℞</tspan>' : ''}</text>`;
    }
    s += `<circle cx="${cx}" cy="${cy}" r="${R_ASPECT}" fill="none" stroke="rgba(167,139,250,0.25)" stroke-width="0.6"/>`;
    s += `</svg>`;
    return s;
}

function chPlanetName(p) {
    const obj = PLANETS.find(x => x.en === p);
    return obj ? L(obj.n) : p;
}

    };
    html += `<div class="reading-block gold"><div class="reading-head">${PLANET_GLYPHS.Sun} ${dict.chSun} · ${L(SIGNS[signOfLong(placements.Sun)].n)} <span class="pos">${houses.Sun}${dict.chHouseSuffix}</span></div><div class="reading-body">${fillTpl(tpl.sun, { sign: L(SIGNS[signOfLong(placements.Sun)].n), house: houses.Sun, signKw: L(SIGNS[signOfLong(placements.Sun)].kw).slice(0,3).join('・'), houseTopic: L(HOUSES[houses.Sun-1].nm), signGen: L(SIGNS[signOfLong(placements.Sun)].gen) })}</div></div>`;
    html += `<div class="reading-block gold"><div class="reading-head">${PLANET_GLYPHS.Moon} ${dict.chMoon} · ${L(SIGNS[signOfLong(placements.Moon)].n)} <span class="pos">${houses.Moon}${dict.chHouseSuffix}</span></div><div class="reading-body">${fillTpl(tpl.moon, { sign: L(SIGNS[signOfLong(placements.Moon)].n), house: houses.Moon, signKw: L(SIGNS[signOfLong(placements.Moon)].kw).slice(0,3).join('・'), houseTopic: L(HOUSES[houses.Moon-1].nm), signGen: L(SIGNS[signOfLong(placements.Moon)].gen) })}</div></div>`;
    html += `<div class="reading-block gold"><div class="reading-head">⊕ ${dict.chAscFull} · ${L(ascSign.n)}</div><div class="reading-body">${fillTpl(tpl.asc, ascSubst)}</div></div>`;
    const mcSubst = {
        sign: L(mcSign.n),
        signKw: L(mcSign.kw).slice(0, 3).join('・'),
        signGen: L(mcSign.gen)
    };
    html += `<div class="reading-block"><div class="reading-head">⊥ ${dict.chMCFull} · ${L(mcSign.n)}</div><div class="reading-body">${fillTpl(tpl.mc, mcSubst)}</div></div>`;
    for (const p of ['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto']) {
        const sign = SIGNS[signOfLong(placements[p])];
        const planetObj = PLANETS.find(x => x.en === p);
        const houseObj = HOUSES[houses[p] - 1];
        const sub = {
            planet: chPlanetName(p),
            sign: L(sign.n),
            house: houses[p],
            signKw: L(sign.kw).slice(0, 3).join('・'),
            houseTopic: L(houseObj.nm),
            signGen: L(sign.gen),
            planetKw: L(planetObj.kw).slice(0, 3).join('・'),
            planetGen: L(planetObj.gen),
            retro: retro[p] ? ` ${dict.chRetro}` : ''
        };
        html += `<div class="reading-block"><div class="reading-head">${PLANET_GLYPHS[p]} ${chPlanetName(p)} · ${L(sign.n)} <span class="pos">${houses[p]}${dict.chHouseSuffix}</span></div><div class="reading-body">${fillTpl(tpl.planet, sub)}</div></div>`;
    }
    html += `</div>`;
    if (aspects.length) {
        html += `<div class="reading-list"><div class="section-h">${dict.chAspects} — ${dict.sec.aInterp.replace('▼ ','')}</div>`;
        for (const a of aspects.slice(0, 8)) {
            const aspObj = ASPECTS[a.idx];
            const sub = {
                p1: chPlanetName(a.p1),
                p2: chPlanetName(a.p2),
                aspectGly: a.gly,
                orb: a.orb.toFixed(1),
                aspectGen: L(aspObj.gen)
            };
            html += `<div class="reading-block"><div class="reading-body">${fillTpl(dict.chAspectTpl, sub)}</div></div>`;
        }
        html += `</div>`;
    }
    html += `<div class="muted-note">${dict.chDisclaimer}</div>`;
    out.innerHTML = html;
    out.querySelectorAll('[data-jump-sign]').forEach(el => el.addEventListener('click', () => {
        const sign = SIGNS.find(s => L(s.n) === el.dataset.jumpSign);
        if (sign) openModal(sign);
    }));
    out.querySelectorAll('[data-jump-planet]').forEach(el => el.addEventListener('click', () => {
        const planet = PLANETS.find(p => p.en === el.dataset.jumpPlanet);
        if (planet) openModal(planet);
    }));
    out.querySelectorAll('[data-jump-aspect]').forEach(el => el.addEventListener('click', () => {
        const asp = ASPECTS[+el.dataset.jumpAspect];
        if (asp) openModal(asp);
    }));
}

const SIGN_GLYPHS = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];

let lastChartInput = null;

function populateChartForm() {
    const dict = I18N_UI[curLang] || I18N_UI.ja;
    const cityIdx = curLang === 'en' ? 1 : 0;
    const cs = document.getElementById('cf-city');
    const tzs = document.getElementById('cf-tz');
    const prevCity = cs.value, prevTz = tzs.value;
    cs.innerHTML = CITIES.map((c, i) => `<option value="${i}">${c[cityIdx]}</option>`).join('') + `<option value="-1">${dict.cfCustom}</option>`;
    tzs.innerHTML = TZ_LIST.map((t, i) => `<option value="${t[0]}">${t[curLang === 'en' ? 2 : 1]}</option>`).join('');
    if (prevCity) cs.value = prevCity;
    if (prevTz) tzs.value = prevTz;
}

populateChartForm();

function calculateChart() {
    const dict = I18N_UI[curLang] || I18N_UI.ja;
    const dateV = document.getElementById('cf-date').value;
    const timeV = document.getElementById('cf-time').value || '12:00';
    const lat = parseFloat(document.getElementById('cf-lat').value);
    const lon = parseFloat(document.getElementById('cf-lon').value);
    const tz = document.getElementById('cf-tz').value;
    const out = document.getElementById('chart-output');
    if (!dateV || isNaN(lat) || isNaN(lon) || !tz) {
        out.innerHTML = `<div class="error-msg">${dict.errBadInput}</div>`;
        return;
    }
    const [yy, mm, dd] = dateV.split('-').map(Number);
    const [hh, mi] = timeV.split(':').map(Number);
    if (!yy || !mm || !dd || yy < 1800 || yy > 2200) {
        out.innerHTML = `<div class="error-msg">${dict.errBadInput}</div>`;
        return;
    }
    try {
        const chart = computeChart(yy, mm, dd, hh, mi || 0, lat, lon, tz);
        const meta = `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')} ${String(hh).padStart(2,'0')}:${String(mi||0).padStart(2,'0')} (${tz}) · ${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
        renderChartOutput(chart, meta);
        lastChartInput = { yy, mm, dd, hh, mi: mi || 0, lat, lon, tz, meta };
        try { localStorage.setItem('pl-chart', JSON.stringify(lastChartInput)); } catch {}
    } catch (e) {
        out.innerHTML = `<div class="error-msg">${dict.errBadInput}<br/><span style="opacity:0.6;font-size:11px">${e.message}</span></div>`;
    }
}

function rerenderChartIfPresent() {
    if (!lastChartInput) return;
    const { yy, mm, dd, hh, mi, lat, lon, tz, meta } = lastChartInput;
    try {
        const chart = computeChart(yy, mm, dd, hh, mi, lat, lon, tz);
        renderChartOutput(chart, meta);
    } catch {}
}

document.getElementById('cf-city').addEventListener('change', (e) => {
    const idx = +e.target.value;
    if (idx < 0) return;
    const c = CITIES[idx];
    document.getElementById('cf-lat').value = c[2];
    document.getElementById('cf-lon').value = c[3];
    document.getElementById('cf-tz').value = c[4];
});
['cf-lat','cf-lon'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
        const cs = document.getElementById('cf-city');
        cs.value = '-1';
    });
});
document.getElementById('cf-calc').addEventListener('click', calculateChart);

try {
    const saved = localStorage.getItem('pl-chart');
    if (saved) {
        const o = JSON.parse(saved);
        if (o && o.yy) {
            document.getElementById('cf-date').value = `${o.yy}-${String(o.mm).padStart(2,'0')}-${String(o.dd).padStart(2,'0')}`;
            document.getElementById('cf-time').value = `${String(o.hh).padStart(2,'0')}:${String(o.mi).padStart(2,'0')}`;
            document.getElementById('cf-lat').value = o.lat;
            document.getElementById('cf-lon').value = o.lon;
            document.getElementById('cf-tz').value = o.tz;
            const cityMatch = CITIES.findIndex(c => Math.abs(c[2] - o.lat) < 0.01 && Math.abs(c[3] - o.lon) < 0.01 && c[4] === o.tz);
            document.getElementById('cf-city').value = cityMatch >= 0 ? cityMatch : -1;
            lastChartInput = o;
        }
    }
} catch {}

const _dateEl = document.getElementById('cf-date');
if (!_dateEl.value) {
    const _t = new Date();
    _dateEl.value = `${_t.getFullYear()}-${String(_t.getMonth()+1).padStart(2,'0')}-${String(_t.getDate()).padStart(2,'0')}`;
}

let initLang;
try { initLang = localStorage.getItem('pl-lang'); } catch {}
if (!initLang) { const nav = (navigator.language || 'ja').toLowerCase(); initLang = nav.startsWith('ja') ? 'ja' : 'en'; }
applyLang(initLang);
updateExtras();
</script>
